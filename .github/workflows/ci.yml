name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: curl -fsS http://localhost:8080/api/analysis > /tmp/analysis.json
      - if: always()
        run: docker compose logs && docker compose down -v
