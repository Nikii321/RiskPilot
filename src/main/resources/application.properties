spring.application.name=RiskPilot
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/riskpilot;MODE=PostgreSQL;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
riskpilot.ml.retraining.enabled=${ML_RETRAIN_ENABLED:true}
riskpilot.ml.retraining.cron=${ML_RETRAIN_CRON:0 0 3 * * *}
riskpilot.ml.retraining.zone=${ML_RETRAIN_ZONE:Europe/Moscow}
riskpilot.ml.retraining.source-path=${ML_TRAINING_CSV:./training-data/history.csv}
riskpilot.ml.retraining.min-validation-auc=${ML_MIN_VALIDATION_AUC:0.55}
riskpilot.ml.retraining.max-brier-regression=${ML_MAX_BRIER_REGRESSION:0.005}
