services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riskpilot
      POSTGRES_USER: riskpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskpilot -d riskpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ML_RETRAIN_ENABLED: ${ML_RETRAIN_ENABLED:-true}
      ML_RETRAIN_CRON: "${ML_RETRAIN_CRON:-0 0 3 * * *}"
      ML_RETRAIN_ZONE: ${ML_RETRAIN_ZONE:-Europe/Moscow}
      ML_TRAINING_CSV: ${ML_TRAINING_CSV:-./training-data/history.csv}
      ML_MIN_VALIDATION_AUC: ${ML_MIN_VALIDATION_AUC:-0.55}
      ML_MAX_BRIER_REGRESSION: ${ML_MAX_BRIER_REGRESSION:-0.005}
      DB_URL: jdbc:postgresql://db:5432/riskpilot
      DB_USER: riskpilot
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    volumes:
      - ./training-data:/app/training-data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
